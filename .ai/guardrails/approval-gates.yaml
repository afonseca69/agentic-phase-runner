gates:
  database_schema:
    description: Changes that create or modify persistent data structures.
    default_action: stop_for_human_review

  destructive_command:
    description: Commands that may remove data, history, generated artifacts, or local state.
    default_action: stop_for_human_review

  production_change:
    description: Changes that affect production environments or delivery pipelines.
    default_action: stop_for_human_review

  external_real_call:
    description: Calls to live external services instead of local fakes or mocks.
    default_action: stop_for_human_review

  architecture_change:
    description: Broad changes to core project boundaries, runtime, or integration contracts.
    default_action: stop_for_human_review

  phase_transition:
    description: Moving to the next phase when the current phase has open risks or incomplete checks.
    default_action: stop_for_human_review
